# Dedicated execution identity for the cross-project Dataform end-to-end test.
#
# Dataform uses this custom service account to submit jobs and create tables in
# BigQuery. The default Dataform service agent remains responsible for the
# Dataform control plane and Developer Connect access; it impersonates this
# account when a workflow runs.
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: dataform-e2e-runner
  annotations:
    # google_service_account uses account_id as its external name.
    crossplane.io/external-name: dataform-e2e-runner
  labels:
    poc: dataform-developer-connect
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    project: cdmc-data
    displayName: Dataform Developer Connect E2E runner
    description: Executes the Dataform-to-BigQuery end-to-end POC workflow.
---
# BigQuery jobs are project-scoped, so the execution identity needs Job User
# on the project in which Dataform submits the jobs.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ProjectIAMMember
metadata:
  name: dataform-e2e-runner-bigquery-job-user
  labels:
    poc: dataform-developer-connect
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    project: cdmc-data
    role: roles/bigquery.jobUser
    member: serviceAccount:dataform-e2e-runner@cdmc-data.iam.gserviceaccount.com
---
# POC convenience: allow the execution identity to create/write BigQuery data
# throughout cdmc-data. For production, replace this project-wide grant with a
# DatasetIAMMember for only the datasets each application is allowed to write.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ProjectIAMMember
metadata:
  name: dataform-e2e-runner-bigquery-data-editor
  labels:
    poc: dataform-developer-connect
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    project: cdmc-data
    role: roles/bigquery.dataEditor
    member: serviceAccount:dataform-e2e-runner@cdmc-data.iam.gserviceaccount.com
---
# Strict act-as: authorize the cdmc-data Dataform service agent to impersonate
# the custom workflow execution identity.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ServiceAccountIAMMember
metadata:
  name: dataform-agent-e2e-runner-service-account-user
  labels:
    poc: dataform-developer-connect
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    serviceAccountId: projects/cdmc-data/serviceAccounts/dataform-e2e-runner@cdmc-data.iam.gserviceaccount.com
    role: roles/iam.serviceAccountUser
    member: serviceAccount:service-370318638050@gcp-sa-dataform.iam.gserviceaccount.com
---
# Strict act-as also requires the Dataform service agent to mint short-lived
# credentials for the custom workflow execution identity.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ServiceAccountIAMMember
metadata:
  name: dataform-agent-e2e-runner-token-creator
  labels:
    poc: dataform-developer-connect
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    serviceAccountId: projects/cdmc-data/serviceAccounts/dataform-e2e-runner@cdmc-data.iam.gserviceaccount.com
    role: roles/iam.serviceAccountTokenCreator
    member: serviceAccount:service-370318638050@gcp-sa-dataform.iam.gserviceaccount.com
